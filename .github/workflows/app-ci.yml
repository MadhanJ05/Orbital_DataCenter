name: Web app checks

on:
  pull_request:
    paths: ['app/**', 'shared/**', '.github/workflows/app-ci.yml']
  push:
    branches: [main]
    paths: ['app/**', 'shared/**']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
