name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', 'shared/**', 'designs/**', 'agents-in-orbit/**', 'dashboard.html', 'twin.html', 'twin3d.html', 'explained.html', 'briefing.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Assemble site (dashboard at root, app under /app/, fleet twins at /twin3d.html and /twin.html)
        working-directory: .
        run: |
          mkdir -p site/app site/designs site/agents-in-orbit
          cp dashboard.html site/dashboard.html
          cp dashboard.html site/index.html
          cp designs/ui.json site/designs/ui.json
          cp agents-in-orbit/*.html site/agents-in-orbit/
          cp twin.html twin3d.html explained.html briefing.html site/
          cp -r app/dist/. site/app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
